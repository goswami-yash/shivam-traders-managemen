version: 0.2

env:
  variables:
    AWS_REGION: "ap-south-1"
    ECR_REPOSITORY: "shivam-traders-backend"

phases:

  install:
    commands:
      - echo "========== INSTALL PHASE =========="
      - echo "AWS CLI: $(aws --version)"
      - echo "Docker: $(docker --version)"

      - |
        if ! docker info >/dev/null 2>&1; then
          echo "ERROR: Docker daemon is not accessible."
          exit 1
        fi

      - echo "Docker daemon is running"

  pre_build:
    commands:
      - echo "========== PRE_BUILD PHASE =========="

      - echo "PROJECT_ENV=${PROJECT_ENV:-NOT_SET}"
      - echo "BUILD_ID=${BUILD_ID:-NOT_SET}"
      - echo "CODEBUILD_BUILD_ID=${CODEBUILD_BUILD_ID:-NOT_SET}"
      - echo "CODEBUILD_SOURCE_VERSION=${CODEBUILD_SOURCE_VERSION:-NOT_SET}"
      - echo "AWS_REGION=${AWS_REGION}"

      # Get AWS account ID automatically
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"

      # Create ECR URI
      - ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - echo "ECR_URI=${ECR_URI}"

      # Build ID
      - echo -n "${BUILD_ID:-$CODEBUILD_BUILD_ID}" > /tmp/build_id.out

      - echo "BUILD_ID=$(cat /tmp/build_id.out)"

      # Docker image name
      - IMAGE_URI="${ECR_URI}/${ECR_REPOSITORY}:$(cat /tmp/build_id.out)"

      - echo "IMAGE_URI=${IMAGE_URI}"

      - echo "${IMAGE_URI}" > /tmp/build_tag.out

      # Login to ECR
      - echo "Logging in to Amazon ECR..."

      - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_URI}"

      - echo "ECR login successful"

  build:
    commands:
      - echo "========== BUILD PHASE =========="

      - echo "Build ID: $(cat /tmp/build_id.out)"

      - echo "Repository: ${ECR_REPOSITORY}"

      - echo "Environment: ${PROJECT_ENV:-$CODEBUILD_SOURCE_VERSION}"

      - |
        sh bin/build.sh \
          "$(cat /tmp/build_id.out)" \
          "${ECR_REPOSITORY}" \
          "${PROJECT_ENV:-$CODEBUILD_SOURCE_VERSION}"

  post_build:
    commands:
      - echo "========== POST_BUILD PHASE =========="

      - |
        sh bin/postBuild.sh \
          "$(cat /tmp/build_id.out)" \
          "${ECR_REPOSITORY}" \
          "${PROJECT_ENV:-$CODEBUILD_SOURCE_VERSION}"

      - echo "========== BUILD COMPLETED =========="

artifacts:
  discard-paths: true
  files:
    - /tmp/build.json