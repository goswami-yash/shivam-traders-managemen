version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-south-1"
    ECR_REPOSITORY: "shivam-traders-backend"

phases:

  install:
    commands:
      - |
        echo "=========================================="
        echo "INSTALL PHASE"
        echo "=========================================="

        echo "AWS CLI:"
        aws --version

        echo "Docker:"
        docker --version

        echo "Checking Docker daemon..."

        if ! docker info > /dev/null 2>&1; then
          echo "ERROR: Docker daemon is not accessible."
          echo "Make sure CodeBuild Privileged Mode is enabled."
          exit 1
        fi

        echo "Docker daemon is running."

  pre_build:
    commands:
      - |
        echo "=========================================="
        echo "PRE_BUILD PHASE"
        echo "=========================================="

        echo "PROJECT_ENV=${PROJECT_ENV:-NOT_SET}"
        echo "BUILD_ID=${BUILD_ID:-NOT_SET}"
        echo "CODEBUILD_BUILD_ID=${CODEBUILD_BUILD_ID:-NOT_SET}"
        echo "CODEBUILD_SOURCE_VERSION=${CODEBUILD_SOURCE_VERSION:-NOT_SET}"
        echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"

      - |
        echo "Getting AWS Account ID..."

        AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
          --query Account \
          --output text)

        if [ -z "$AWS_ACCOUNT_ID" ]; then
          echo "ERROR: AWS_ACCOUNT_ID is empty."
          exit 1
        fi

        echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"

        ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

        echo "ECR_REGISTRY=${ECR_REGISTRY}"

        export AWS_ACCOUNT_ID
        export ECR_REGISTRY

      - |
        echo "Creating build ID..."

        BUILD_TAG="${BUILD_ID:-$CODEBUILD_BUILD_ID}"

        echo -n "$BUILD_TAG" > /tmp/build_id.out

        echo "BUILD_TAG=$BUILD_TAG"

      - |
        BUILD_TAG=$(cat /tmp/build_id.out)

        ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${BUILD_TAG}"

        echo "ECR_IMAGE=${ECR_IMAGE}"

        echo "$ECR_IMAGE" > /tmp/build_tag.out

      - |
        echo "=========================================="
        echo "LOGIN TO AMAZON ECR"
        echo "=========================================="

        aws ecr get-login-password \
          --region "$AWS_DEFAULT_REGION" | \
          docker login \
          --username AWS \
          --password-stdin "$ECR_REGISTRY"

        echo "ECR login successful."

  build:
    commands:
      - |
        echo "=========================================="
        echo "BUILD PHASE"
        echo "=========================================="

        BUILD_TAG=$(cat /tmp/build_id.out)

        echo "BUILD_TAG=$BUILD_TAG"
        echo "REPOSITORY=$ECR_REPOSITORY"
        echo "PROJECT_ENV=${PROJECT_ENV:-$CODEBUILD_SOURCE_VERSION}"

        chmod +x bin/build.sh

        sh bin/build.sh \
          "$BUILD_TAG" \
          "$ECR_REPOSITORY" \
          "${PROJECT_ENV:-$CODEBUILD_SOURCE_VERSION}"

  post_build:
    commands:
      - |
        echo "=========================================="
        echo "POST BUILD PHASE"
        echo "=========================================="

        BUILD_TAG=$(cat /tmp/build_id.out)

        echo "BUILD_TAG=$BUILD_TAG"
        echo "REPOSITORY=$ECR_REPOSITORY"
        echo "PROJECT_ENV=${PROJECT_ENV:-$CODEBUILD_SOURCE_VERSION}"

        chmod +x bin/postBuild.sh

        sh bin/postBuild.sh \
          "$BUILD_TAG" \
          "$ECR_REPOSITORY" \
          "${PROJECT_ENV:-$CODEBUILD_SOURCE_VERSION}"

      - |
        echo "=========================================="
        echo "BUILD COMPLETED"
        echo "=========================================="

        if [ -f /tmp/build_tag.out ]; then
          echo "Docker image:"
          cat /tmp/build_tag.out
        fi

artifacts:
  discard-paths: true
  files:
    - /tmp/build.json